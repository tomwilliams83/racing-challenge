<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nags Challenge — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } body { background: #eef6fd; font-family: 'DM Sans', sans-serif; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const C = { bg:"#eef6fd",card:"#fff",border:"#bdd9f5",pink:"#ff007f",pinkLt:"#ff4dab",pinkDk:"#cc0066",pinkBg:"#fff0f8",blue:"#1a7fd4",blueLt:"#4aa8f0",blueDk:"#0d5fa8",blueBg:"#eff8ff",text:"#0d2d4a",muted:"#5a8aaa",mutedLt:"#a8c8e0",danger:"#ff3b30" };
    const UK = ["aintree","ascot","bath","beverley","brighton","carlisle","cartmel","catterick","cheltenham","chelmsford","chelmsford city","chepstow","chester","doncaster","epsom","epsom downs","exeter","fakenham","ffos las","fontwell","fontwell park","goodwood","great yarmouth","yarmouth","hamilton","hamilton park","haydock","haydock park","hereford","hexham","huntingdon","kempton","kempton park","leicester","lingfield","lingfield park","ludlow","market rasen","musselburgh","newbury","newcastle","newmarket","newton abbot","nottingham","perth","plumpton","pontefract","redcar","ripon","salisbury","sandown","sandown park","sedgefield","southwell","stratford","taunton","thirsk","towcester","uttoxeter","warwick","wetherby","wincanton","windsor","wolverhampton","worcester","york","ayr","bangor","kelso","ballinrobe","bellewstown","clonmel","cork","curragh","the curragh","dundalk","fairyhouse","galway","gowran","gowran park","kilbeggan","killarney","laytown","leopardstown","limerick","listowel","naas","navan","punchestown","roscommon","sligo","thurles","tipperary","tramore","waterford","wexford","down royal","downpatrick"];
    const isUK = c => { const s=(c||"").toLowerCase().trim(); return UK.some(k=>s.includes(k)||k.includes(s)); };
    const getEW = n => n<=4?null:n<=7?{places:2,fraction:4}:n<=15?{places:3,fraction:4}:{places:4,fraction:4};
    function parseCards(data) {
      return (data.racecards||[]).filter(r=>isUK(r.course||"")).map(r=>{
        const isH=/handicap/i.test(r.race_name||"");
        const raw=r.off_time||r.off||r.time||"";
        const mm=String(raw).match(/(\d{1,2}):(\d{2})/);
        const time=mm?(parseInt(mm[1])<10?parseInt(mm[1])+12:parseInt(mm[1]))+":"+mm[2]:raw;
        return {id:r.race_id||r.id,course:r.course||"Unknown",time,name:r.race_name||"Race",distance:r.distance_round||"",going:r.going||"",isHandicap:isH,runners:(r.runners||[]).length,ewTerms:getEW((r.runners||[]).length,isH)};
      }).sort((a,b)=>a.time.localeCompare(b.time));
    }

    const CSS = `
      .card{background:#fff;border:1.5px solid ${C.border};border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(26,127,212,.05);}
      .field{margin-bottom:16px;} .field label{display:block;font-size:11px;letter-spacing:2px;color:${C.muted};margin-bottom:7px;font-weight:600;text-transform:uppercase;}
      .inp{width:100%;background:${C.bg};border:1.5px solid ${C.border};border-radius:10px;color:${C.text};padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:15px;}
      .inp:focus{outline:none;border-color:${C.pink};}
      .btn{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;border:none;cursor:pointer;border-radius:10px;padding:12px 24px;transition:all .18s;}
      .btn:disabled{opacity:.38;cursor:not-allowed;}
      .btn-pink{background:linear-gradient(135deg,${C.pink},${C.pinkLt});color:#fff;box-shadow:0 4px 16px rgba(255,10,108,.4);width:100%;}
      .btn-blue{background:linear-gradient(135deg,${C.blue},${C.blueLt});color:#fff;width:100%;}
      .btn-outline{background:#fff;border:1.5px solid ${C.border};color:${C.muted};}
      .err{color:${C.danger};font-size:14px;margin-top:10px;padding:10px 14px;background:#fff5f5;border:1.5px solid #ffb3b3;border-radius:10px;}
      .sec-title{font-family:'DM Serif Display',serif;font-size:24px;color:${C.text};margin-bottom:16px;}
      .eyebrow{font-size:10px;letter-spacing:3px;color:${C.muted};margin-bottom:5px;font-weight:600;text-transform:uppercase;display:block;}
      .time-badge{display:inline-block;background:${C.pink};color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-right:8px;}
      .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
      .b-pink{background:${C.pinkBg};color:${C.pink};border:1.5px solid ${C.pinkLt};}
      .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:${C.text};color:#fff;padding:12px 26px;border-radius:24px;font-weight:600;font-size:15px;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);}
      .ca{border:1.5px solid ${C.border};border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff;}
      .ch{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;}
      .ch:hover{background:${C.bg};} .ch.sel{background:${C.pinkBg};border-bottom:1.5px solid ${C.pink};}
      .cr{border-top:1.5px solid ${C.border};}
      .crr{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;cursor:pointer;border-bottom:1px solid ${C.bg};}
      .crr:last-child{border-bottom:none;} .crr:hover{background:${C.bg};} .crr.sel{background:${C.pinkBg};}
      .day-toggle{display:flex;gap:10px;}
      .day-btn{flex:1;padding:11px;background:${C.bg};border:1.5px solid ${C.border};border-radius:12px;color:${C.muted};font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
      .day-btn.active{background:${C.pink};border-color:${C.pinkDk};color:#fff;}
      .fade{animation:fadeIn .3s ease;} @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      .loader{display:flex;gap:8px;justify-content:center;padding:40px;}
      .loader span{width:10px;height:10px;border-radius:50%;animation:lb .7s infinite alternate;}
      .loader span:nth-child(1){background:${C.pink};} .loader span:nth-child(2){background:${C.blue};animation-delay:.15s;} .loader span:nth-child(3){background:${C.pink};animation-delay:.3s;}
      @keyframes lb{from{transform:translateY(0);opacity:.4}to{transform:translateY(-13px);opacity:1}}
    `;

    function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}
    function Loader(){return <div className="loader"><span/><span/><span/></div>;}

    function Accordion({racecards,selected,toggle}){
      const grouped=racecards.reduce((a,r)=>{(a[r.course]=a[r.course]||[]).push(r);return a;},{});
      const courses=Object.keys(grouped).sort();
      const [open,setOpen]=useState(new Set());
      function tog(c){setOpen(p=>{const n=new Set(p);n.has(c)?n.delete(c):n.add(c);return n;});}
      function selAll(course,e){e.stopPropagation();const races=grouped[course];const all=races.every(r=>selected.has(r.id));races.forEach(r=>{if(all){if(selected.has(r.id))toggle(r.id);}else{if(!selected.has(r.id))toggle(r.id);}});}
      return(
        <div className="fade">
          <p style={{color:C.muted,marginBottom:12,fontSize:14,fontWeight:500}}>Tap a course to expand — <strong style={{color:C.pink}}>{selected.size} race{selected.size!==1?"s":""} selected</strong></p>
          {courses.map(course=>{
            const races=grouped[course];const sc=races.filter(r=>selected.has(r.id)).length;const isO=open.has(course);
            return(<div key={course} className="ca">
              <div className={`ch${sc>0?" sel":""}`} onClick={()=>tog(course)}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:15,fontWeight:700,color:sc>0?C.pink:C.text}}>{course}</span>
                  <span style={{fontSize:12,color:C.muted}}>{races.length} race{races.length!==1?"s":""}</span>
                  {sc>0&&<span className="badge b-pink">{sc} selected</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  {isO&&<button style={{fontSize:12,color:sc===races.length?C.danger:C.blue,fontWeight:600,background:"none",border:"none",cursor:"pointer"}} onClick={e=>selAll(course,e)}>{sc===races.length?"Deselect all":"Select all"}</button>}
                  <span style={{fontSize:11,color:C.muted,display:"inline-block",transform:isO?"rotate(180deg)":"none",transition:"transform .2s"}}>▼</span>
                </div>
              </div>
              {isO&&<div className="cr">{races.map(r=>{const iS=selected.has(r.id);return(
                <div key={r.id} className={`crr${iS?" sel":""}`} onClick={()=>toggle(r.id)}>
                  <div>
                    <div style={{fontSize:14,fontWeight:600,color:iS?C.pink:C.text}}><span className="time-badge">{r.time}</span>{r.name}{r.isHandicap&&<span style={{fontSize:11,color:C.muted,marginLeft:6}}>HCP</span>}</div>
                    <div style={{fontSize:12,color:C.muted,marginTop:3}}>{r.runners} runners{r.distance?` · ${r.distance}`:""}{r.going?` · ${r.going}`:""}{r.ewTerms?` · EW ${r.ewTerms.places} places`:" · Win only"}</div>
                  </div>
                  <span style={{fontSize:20}}>{iS?"✅":"⬜"}</span>
                </div>);})}</div>}
            </div>);
          })}
        </div>
      );
    }

    function Admin(){
      const [step,setStep]=useState("auth");
      const [key,setKey]=useState("");
      const [authErr,setAuthErr]=useState("");
      const [day,setDay]=useState("today");
      const [label,setLabel]=useState("");
      const [cards,setCards]=useState([]);
      const [selected,setSelected]=useState(new Set());
      const [loading,setLoading]=useState(false);
      const [saving,setSaving]=useState(false);
      const [err,setErr]=useState("");
      const [toast,setToast]=useState(null);
      const [current,setCurrent]=useState(null);

      function showToast(m){setToast(m);setTimeout(()=>setToast(null),2500);}
      function toggle(id){setSelected(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});}

      async function auth(){
        if(!key.trim())return setAuthErr("Enter your admin key");
        try{
          const res=await fetch('/api/itv',{headers:{'Authorization':`Bearer ${key}`}});
          if(res.status===401)return setAuthErr("Invalid admin key");
          const data=await res.json();
          setCurrent(data); setStep("setup");
          if(data.label)setLabel(data.label);
        }catch(e){setAuthErr(e.message);}
      }

      async function load(){
        setLoading(true);setErr("");
        try{
          const res=await fetch(`/api/racecards?day=${day}`);
          const data=await res.json();
          const parsed=parseCards(data);
          setCards(parsed);
          if(current?.raceIds?.length){const cs=new Set(current.raceIds);setSelected(new Set(parsed.filter(r=>cs.has(r.id)).map(r=>r.id)));}
          if(!parsed.length)setErr("No UK/Irish races found.");
        }catch(e){setErr(e.message);}
        setLoading(false);
      }

      async function save(){
        if(!label.trim())return setErr("Add a label before saving");
        if(selected.size===0)return setErr("Select at least one race");
        setSaving(true);
        try{
          const res=await fetch('/api/itv',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({raceIds:[...selected],label:label.trim()})});
          if(!res.ok)throw new Error("Save failed");
          showToast(`✅ Saved — ${selected.size} races`);
          setStep("done");
        }catch(e){setErr(e.message);}
        setSaving(false);
      }

      async function clearCard(){
        if(!confirm("Clear the current ITV card?"))return;
        await fetch('/api/itv',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({raceIds:[],label:''})});
        showToast("ITV card cleared");setCurrent(null);setLabel("");setSelected(new Set());setCards([]);setStep("setup");
      }

      if(step==="auth")return(
        <div style={{paddingTop:48}} className="fade">
          <Toast msg={toast}/>
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{fontSize:52,marginBottom:12}}>🔑</div>
            <div className="sec-title">Admin Access</div>
            <p style={{color:C.muted,fontSize:15}}>Enter your admin key to manage the ITV card</p>
          </div>
          <div className="card">
            <div className="field">
              <label>Admin Key</label>
              <input className="inp" type="password" placeholder="Enter key…" value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&auth()}/>
            </div>
            {authErr&&<div className="err">{authErr}</div>}
            <button className="btn btn-blue" style={{marginTop:8}} onClick={auth} disabled={!key.trim()}>Continue →</button>
          </div>
        </div>
      );

      if(step==="done")return(
        <div style={{paddingTop:48,textAlign:"center"}} className="fade">
          <Toast msg={toast}/>
          <div style={{fontSize:64,marginBottom:16}}>✅</div>
          <div className="sec-title">ITV Card Saved!</div>
          <p style={{color:C.muted,marginBottom:8}}><strong>{label}</strong></p>
          <p style={{color:C.muted,marginBottom:32}}>{selected.size} races will be pre-selected for organisers</p>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="btn btn-outline" onClick={()=>{setStep("setup");setCards([]);setSelected(new Set());}}>Set another card</button>
            <button className="btn btn-outline" style={{color:C.danger,borderColor:C.danger}} onClick={clearCard}>Clear card</button>
          </div>
        </div>
      );

      return(
        <div style={{paddingTop:24}} className="fade">
          <Toast msg={toast}/>
          {current?.raceIds?.length>0&&(
            <div className="card" style={{marginBottom:16,background:C.blueBg,borderColor:C.blue}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div className="eyebrow">Current ITV Card</div>
                  <div style={{fontWeight:600,color:C.text}}>{current.label||"(unlabelled)"}</div>
                  <div style={{fontSize:13,color:C.muted}}>{current.raceIds.length} races set</div>
                </div>
                <button className="btn btn-outline" style={{fontSize:13,color:C.danger,borderColor:C.danger}} onClick={clearCard}>Clear</button>
              </div>
            </div>
          )}
          <div className="eyebrow">ITV Card Setup</div>
          <div className="sec-title">Set Featured Races</div>
          <div className="card" style={{marginBottom:14}}>
            <div className="field">
              <label>Card Label</label>
              <input className="inp" placeholder="e.g. ITV7 — Saturday 29 March 2026" value={label} onChange={e=>setLabel(e.target.value)}/>
            </div>
            <div className="field" style={{marginBottom:14}}>
              <label>Race day</label>
              <div className="day-toggle">
                <button className={`day-btn${day==="today"?" active":""}`} onClick={()=>setDay("today")}>Today</button>
                <button className={`day-btn${day==="tomorrow"?" active":""}`} onClick={()=>setDay("tomorrow")}>Tomorrow</button>
              </div>
            </div>
            <button className="btn btn-blue" onClick={load} disabled={loading}>{loading?"Loading…":"Load Races"}</button>
            {err&&<div className="err" style={{marginTop:10}}>{err}</div>}
          </div>
          {loading&&<Loader/>}
          {cards.length>0&&(
            <div className="fade">
              <Accordion racecards={cards} selected={selected} toggle={toggle}/>
              <div style={{marginTop:20}}>
                <button className="btn btn-pink" disabled={selected.size===0||saving||!label.trim()} onClick={save}>
                  {saving?"Saving…":`💾 Save ${selected.size} Race${selected.size!==1?"s":""} as ITV Card`}
                </button>
                {!label.trim()&&selected.size>0&&<p style={{color:C.muted,fontSize:13,marginTop:8,textAlign:"center"}}>Add a label before saving</p>}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <><style>{CSS}</style>
      <div style={{background:"linear-gradient(135deg,#1a7fd4,#0d5fa8)",padding:"18px 0",textAlign:"center",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 20px rgba(13,95,168,.25)"}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:26,color:"#fff"}}>🐴 Nags Admin</div>
        <div style={{fontSize:10,letterSpacing:3,color:"rgba(255,255,255,.5)",marginTop:3,fontWeight:600}}>ITV CARD MANAGER</div>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:"0 16px 80px"}}><Admin/></div></>
    );
  </script>
</body>
</html>
